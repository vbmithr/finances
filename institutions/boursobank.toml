version = 1
institution = "boursobank"
aliases = ["boursorama", "bourso"]
type = "bank"

[[statements]]
format = "ofx"

[[statements]]
format = "csv"
definition = "csv/boursobank.json"

[rules."boursobank-default-01"]
pattern = '^(?:Relevé différé Carte |Relev\{ diff\{r\{ Carte ).+'
case_sensitive = true
priority = 0
action = "type"
target = "card-settlement"

[rules."boursobank-default-02"]
pattern = '^(?:PAIEMENT\s+CARTE|AVOIR)(?:\s|$)'
case_sensitive = false
priority = 1
action = "type"
target = "card"

[rules."boursobank-default-03"]
pattern = '^CARTE(?:\s|$)'
case_sensitive = false
priority = 2
account_type = "CREDITCRD"
action = "type"
target = "card"

[rules."boursobank-default-04"]
pattern = '^(?:VIR|VIREMENT)(?:\s|$)'
case_sensitive = false
priority = 3
action = "type"
target = "transfer"

[rules."boursobank-default-05"]
pattern = '^(?:PRLV|PRELEVEMENT)(?:\s|$)'
case_sensitive = false
priority = 4
action = "type"
target = "direct-debit"

[rules."boursobank-default-06"]
pattern = '^(?:RETRAIT|ANNUL\s+RETRAIT\s+DAB)(?:\s|$)'
case_sensitive = false
priority = 5
action = "type"
target = "withdrawal"

[rules."boursobank-default-07"]
pattern = '^(?:\*INTERETS|INTERETS|\*INTÉRÊTS|INTÉRÊTS|\*INTER\.BRUTS|\*INT\s+DEB)(?:\s|$)'
case_sensitive = false
priority = 6
action = "type"
target = "interest"

[rules."boursobank-default-08"]
pattern = '^REM\s+CHQ(?:\s|$)'
case_sensitive = false
priority = 7
action = "type"
target = "deposit"

[rules."boursobank-default-09"]
pattern = '^CHQ\.(?:\s|$)'
case_sensitive = false
priority = 8
action = "type"
target = "cheque"

[rules."boursobank-default-10"]
pattern = '^(?:\*CION\s+CB|\*FRAIS\s+CB|\*RETROC\s+\*FRAIS\s+CB)(?:\s|$)'
case_sensitive = false
priority = 9
action = "type"
target = "fee"

[rules."boursobank-card-reference"]
pattern = '^(?:Relevé différé Carte |Relev\{ diff\{r\{ Carte )([\s\S]+)$'
case_sensitive = true
priority = 100
action = "card-reference"
target = "card-reference"

[rules."boursobank-withdrawal-reversal"]
pattern = '^ANNUL RETRAIT DAB '
case_sensitive = false
priority = 100
action = "withdrawal-reversal"
target = "withdrawal-reversal"

version = 1
institution = "revolut"
aliases = []
type = "bank"

[[statements]]
format = "csv"
definition = "csv/revolut.json"

[rules."revolut-reported-card-payment"]
pattern = '^Card Payment$'
case_sensitive = true
priority = 0
action = "type"
target = "card"
field = "Type"

[rules."revolut-reported-card-refund"]
pattern = '^Card Refund$'
case_sensitive = true
priority = 1
action = "type"
target = "card"
field = "Type"

[rules."revolut-reported-deposit"]
pattern = '^Deposit$'
case_sensitive = true
priority = 2
action = "type"
target = "deposit"
field = "Type"

[rules."revolut-reported-transfer"]
pattern = '^Transfer$'
case_sensitive = true
priority = 3
action = "type"
target = "transfer"
field = "Type"

[rules."revolut-reported-atm"]
pattern = '^ATM$'
case_sensitive = true
priority = 4
action = "type"
target = "withdrawal"
field = "Type"

[rules."revolut-reported-charge"]
pattern = '^Charge$'
case_sensitive = true
priority = 5
action = "type"
target = "fee"
field = "Type"

[rules."revolut-reported-other"]
pattern = '.+'
case_sensitive = true
priority = 100
action = "type"
target = "revolut:{value}"
field = "Type"
